[package]
name = "aurora-gallery"
version = "1.1.3"
description = "A modern image gallery and management application"
authors = ["MISAKIMIKU"]
license = "MIT"
repository = "https://github.com/misakimiku2/aurora-gallery-tauri"
edition = "2021"
default-run = "aurora-gallery"

[lib]
name = "aurora_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "aurora-gallery"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
aurora-core = { path = "../core" }
tauri = { version = "2.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
imageinfo = "0.7"
image = { version = "0.24", features = ["jpeg", "png", "gif", "webp"] }
jxl-oxide = { version = "0.9.0", features = ["rayon"] }
webp = "0.2"
fast_image_resize = "3.0"
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
rayon = "1.8"
base64 = "0.21"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
palette = { version = "0.7", features = ["std"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
color-thief = "0.2.2"
rusqlite = { version = "0.30", features = ["bundled", "serde_json"] }
futures = "0.3"
num_cpus = "1.16"
crossbeam-channel = "0.5"
jpeg-decoder = "0.2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
once_cell = "1.19"
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"

# LAN Share Support（桌面端与安卓端共用：安卓端 HTTP 服务端复用同一套 Axum 代码）
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip"] }
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(not(windows))'.dependencies]
fs_extra = "1.3"

# Desktop-only dependencies
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
arboard = "3"

# CLIP Model Support (ONNX Runtime with DirectML) - Desktop only
ort = { version = "2.0.0-rc.9", features = ["directml", "ndarray"] }
ndarray = { version = "0.15", features = ["rayon"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
csv = "1.4.0"

# 桌面端 LAN Share 服务端专用依赖
local-ip-address = "0.6"

# Android 特定依赖
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.8"
ndk-sys = "0.5"
ndk-context = "0.1"
flate2 = "1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Android 编译配置
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.aarch64-linux-android]
linker = "aarch64-linux-android30-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi30-clang"

[target.i686-linux-android]
linker = "i686-linux-android30-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android30-clang"

