[package]
name = "photocraft-raster"
version = "0.15.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Vendored from PhotoCraft (storytold/photocraft) crates/raster at v0.15.1; manifests de-workspaced for standalone use"

[dependencies]
photocraft-geom = { path = "../geom" }
photocraft-color = { path = "../color" }
serde = { version = "1", features = ["derive", "rc"] }

# Native only: converting a region's tiles is independent per tile, so it runs on all cores.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
proptest = "1"
