[package]
name = "aurora-core"
version = "0.1.0"
edition = "2021"
description = "Aurora Gallery 核心数据层（平台无关），供 Tauri 壳与 Kotlin(UniFFI) 双端共享"

[lib]
name = "aurora_core"
# rlib 供 src-tauri path 依赖；cdylib 供 UniFFI library 模式生成 Kotlin 绑定（M1 阶段 1 用）
crate-type = ["cdylib", "rlib"]

# UniFFI 绑定生成器 CLI（library 模式生成 Kotlin 绑定）
[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
rusqlite = { version = "0.30", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
color-thief = "0.2.2"
image = { version = "0.24", features = ["jpeg", "png", "gif", "webp"] }
palette = { version = "0.7", features = ["std"] }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "1"
