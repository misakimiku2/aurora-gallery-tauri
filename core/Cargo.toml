[package]
name = "aurora-core"
version = "0.1.0"
edition = "2021"
description = "Aurora Gallery 核心数据层（平台无关），供 Tauri 壳与 Kotlin(UniFFI) 双端共享"

[lib]
name = "aurora_core"
# rlib 供 src-tauri path 依赖；cdylib 供 UniFFI library 模式生成 Kotlin 绑定（M1 阶段 1 用）
crate-type = ["cdylib", "rlib"]

# UniFFI 绑定生成器 CLI（library 模式生成 Kotlin 绑定）
[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
rusqlite = { version = "0.30", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
color-thief = "0.2.2"
# 默认 feature 已覆盖 jpeg/png/gif/webp/bmp/tiff/ico（avif、svg、jxl 不在其中，
# 正是编辑器 Phase 0 排除的那三个，见 src/imaging/mod.rs）。`webp` 同时提供
# 解码与 **VP8L 无损编码**（见 image/src/io/free_functions.rs 的 WebP 分支），
# 所以文档存储的 WebP lossless 不需要额外引入 `webp` crate。
image = { version = "0.24", features = ["jpeg", "png", "gif", "webp"] }
# `.aurora` 编辑文档容器（§4.4 写侧定死在 Rust）。与 src-tauri 同一份声明：
# 只开 deflate（纯 Rust 后端），不引 bzip2/zstd 这些要编 C 的可选压缩器。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 编辑器像素通道（Phase 0）。与 src-tauri 保持同一大版本，避免两端缩放算法/精度分叉。
fast_image_resize = "3.0"
palette = { version = "0.7", features = ["std"] }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "1"
icu_collator = "2"
icu_locale_core = "2"
# M6b AI 编排下沉（D35a）：blocking 客户端自带 tokio 运行时线程，core 不直接依赖 tokio；
# rustls-tls = webpki-roots 内嵌 CA（Android 不依赖系统证书库）；与 src-tauri 的 reqwest 0.12 版本对齐
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# 依赖走优化、core 自身保持 opt-level=0（理由与 src-tauri 的同名配置一致：
# 代理图管线的热点在 fast_image_resize / image，debug 下慢 20~50 倍）。
# core 是独立 package，被 src-tauri 依赖时以 src-tauri 的 profile 为准；
# 这一份只影响「在 core 目录下跑 test / bench」的场景。
[profile.dev.package."*"]
opt-level = 3
