name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (type check + build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build main app (tsc + vite build)
        run: npm run build

      - name: Build LAN share web client
        run: npm run build:lan-share

      - name: Run tests
        run: npx vitest run

  # Rust 后端检查（桌面版 cargo check）。首次运行需拉取全部依赖，耗时较长。
  # 注意：本仓库 .cargo/config.toml 含本机 Android NDK 绝对路径，仅影响 android target，
  # 桌面 target 不受影响。若需要启用，请先确认 ort(directml) 在 Linux 上可编译。
