[package]
name = "aurora-editor"
version = "0.1.0"
edition = "2021"
description = "aurora-gallery 图片编辑器 v3:photocraft 引擎桥(无 tauri/UI 依赖)"

[dependencies]
photocraft-engine = { path = "../photocraft-vendor/crates/engine" }
photocraft-compose = { path = "../photocraft-vendor/crates/compose" }
photocraft-geom = { path = "../photocraft-vendor/crates/geom" }
photocraft-color = { path = "../photocraft-vendor/crates/color" }
photocraft-raster = { path = "../photocraft-vendor/crates/raster" }
photocraft-io = { path = "../photocraft-vendor/crates/io" }
photocraft-format = { path = "../photocraft-vendor/crates/format" }
serde_json = "1"
rayon = "1"
